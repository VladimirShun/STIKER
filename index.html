<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мой редактор стикеров</title>
<style>
  body { font-family: Arial, sans-serif; text-align: center; background: #1e1e2e; color: #fff; margin: 10px; }
  h1 { font-size: 22px; }
  #cv { max-width: 100%; border: 3px solid #7c3aed; border-radius: 10px; touch-action: none; background: #333; }
  .btn { font-size: 16px; padding: 10px 12px; margin: 4px; border: none; border-radius: 8px;
         background: #7c3aed; color: #fff; cursor: pointer; }
  .btn:active { background: #5b21b6; }
  #fileInput { margin: 10px 0; }
</style>
</head>
<body>

<h1>🐱 Мой редактор стикеров</h1>

<input type="file" id="fileInput" accept="image/*">
<br>

<canvas id="cv" width="400" height="400"></canvas>

<p>
  <button class="btn sticker-btn" data-label="👂👂" data-size="110">Огромные уши</button>
  <button class="btn sticker-btn" data-label="🧔" data-size="90">Борода</button>
  <button class="btn sticker-btn" data-label="😎" data-size="80">Очки</button>
  <button class="btn sticker-btn" data-label="🥓🥓🥓" data-size="70">Ремень из колбасок</button>
</p>

<p>
  <button class="btn" id="undo">↩️ Убрать последний</button>
  <button class="btn" id="clear">🗑️ Убрать всё</button>
  <button class="btn" id="download">💾 Скачать</button>
</p>

<script>
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var img = null;
  var stickers = [];
  var drag = null;
  var off = { x: 0, y: 0 };
  var MAX = 1000;

  function draw() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    if (img) {
      ctx.drawImage(img, 0, 0, cv.width, cv.height);
    } else {
      ctx.fillStyle = '#444';
      ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.fillStyle = '#fff';
      ctx.font = '22px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('Сначала загрузи фото ↑', cv.width / 2, cv.height / 2);
    }
    for (var i = 0; i < stickers.length; i++) {
      var s = stickers[i];
      ctx.font = s.size + 'px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(s.label, s.x, s.y);
    }
  }

  document.getElementById('fileInput').addEventListener('change', function (e) {
    var f = e.target.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function (ev) {
      var image = new Image();
      image.onload = function () {
        img = image;
        var w = image.width, h = image.height;
        if (w > MAX || h > MAX) {
          if (w > h) { h = h * MAX / w; w = MAX; }
          else { w = w * MAX / h; h = MAX; }
        }
        cv.width = Math.round(w);
        cv.height = Math.round(h);
        stickers = [];
        draw();
      };
      image.src = ev.target.result;
    };
    reader.readAsDataURL(f);
  });

  var btns = document.querySelectorAll('.sticker-btn');
  for (var b = 0; b < btns.length; b++) {
    btns[b].addEventListener('click', function () {
      if (!img) { alert('Сначала загрузи фото!'); return; }
      stickers.push({
        label: this.dataset.label,
        size: Number(this.dataset.size),
        x: cv.width / 2,
        y: cv.height / 2
      });
      draw();
    });
  }

  function getPos(e) {
    var r = cv.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) * cv.width / r.width,
      y: (e.clientY - r.top) * cv.height / r.height
    };
  }

  cv.addEventListener('pointerdown', function (e) {
    if (!img) return;
    var p = getPos(e);
    for (var i = stickers.length - 1; i >= 0; i--) {
      var s = stickers[i];
      var rad = Math.max(s.size, 40);
      if (Math.hypot(p.x - s.x, p.y - s.y) < rad) {
        drag = s;
        off.x = p.x - s.x;
        off.y = p.y - s.y;
        cv.setPointerCapture(e.pointerId);
        return;
      }
    }
  });

  cv.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var p = getPos(e);
    drag.x = p.x - off.x;
    drag.y = p.y - off.y;
    draw();
  });

  cv.addEventListener('pointerup', function () { drag = null; });
  cv.addEventListener('pointercancel', function () { drag = null; });

  document.getElementById('undo').addEventListener('click', function () {
    stickers.pop();
    draw();
  });

  document.getElementById('clear').addEventListener('click', function () {
    stickers = [];
    draw();
  });

  document.getElementById('download').addEventListener('click', function () {
    if (!img) { alert('Сначала загрузи фото!'); return; }
    draw();
    var a = document.createElement('a');
    a.download = 'my-sticker.png';
    a.href = cv.toDataURL('image/png');
    a.click();
  });

  draw();
</script>

</body>
</html>
