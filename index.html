<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мой редактор стикеров</title>
<style>
  body { font-family: Arial, sans-serif; text-align: center; background: #1e1e2e; color: #fff; margin: 10px; }
  h1 { font-size: 22px; }
  #cv { max-width: 100%; border: 3px solid #7c3aed; border-radius: 10px; touch-action: none; background: #333; }
  .btn { font-size: 16px; padding: 10px 12px; margin: 4px; border: none; border-radius: 8px;
         background: #7c3aed; color: #fff; cursor: pointer; }
  .btn:active { background: #5b21b6; }
  #fileInput { margin: 10px 0; }
</style>
</head>
<body>

<h1>🐱 Мой редактор стикеров</h1>

<input type="file" id="fileInput" accept="image/*">
<br>

<canvas id="cv" width="400" height="400"></canvas>

<p>
  <button class="btn sticker-btn" data-type="ears" data-size="200">Огромные уши</button>
  <button class="btn sticker-btn" data-type="beard" data-size="160">Борода</button>
  <button class="btn sticker-btn" data-type="glasses" data-size="150">Очки</button>
  <button class="btn sticker-btn" data-type="belt" data-size="180">Ремень из колбасок</button>
</p>

<p>
  <button class="btn" id="undo">↩️ Убрать последний</button>
  <button class="btn" id="clear">🗑️ Убрать всё</button>
  <button class="btn" id="download">💾 Скачать</button>
</p>

<script>
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var img = null;
  var stickers = [];
  var drag = null;
  var off = { x: 0, y: 0 };
  var MAX = 1000;

  function drawEars(s) {
    var w = s.size;
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.fillStyle = '#ffd9b3';
    ctx.strokeStyle = '#c98a63';
    ctx.lineWidth = Math.max(2, w * 0.01);
    ctx.beginPath(); ctx.ellipse(-w * 0.35, 0, w * 0.16, w * 0.32, 0.3, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse( w * 0.35, 0, w * 0.16, w * 0.32, -0.3, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#f0a884';
    ctx.beginPath(); ctx.ellipse(-w * 0.35, 0, w * 0.08, w * 0.19, 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse( w * 0.35, 0, w * 0.08, w * 0.19, -0.3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawGlasses(s) {
    var w = s.size;
    var r = w * 0.22;
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.fillStyle = 'rgba(120,180,255,0.25)';
    ctx.beginPath(); ctx.arc(-w * 0.26, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc( w * 0.26, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#111';
    ctx.lineWidth = Math.max(4, w * 0.07);
    ctx.beginPath(); ctx.arc(-w * 0.26, 0, r, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc( w * 0.26, 0, r, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-w * 0.04, 0); ctx.lineTo(w * 0.04, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-w * 0.26 - r, 0); ctx.lineTo(-w * 0.5, -w * 0.07); ctx.stroke();
    ctx.beginPath(); ctx.moveTo( w * 0.26 + r, 0); ctx.lineTo( w * 0.5, -w * 0.07); ctx.stroke();
    ctx.restore();
  }

  function drawBeard(s) {
    var w = s.size;
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.fillStyle = '#7a3b12';
    ctx.beginPath(); ctx.arc(0, -w * 0.08, w * 0.45, 0, Math.PI); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-w * 0.14, -w * 0.12, w * 0.16, w * 0.05, 0.35, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse( w * 0.14, -w * 0.12, w * 0.16, w * 0.05, -0.35, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#9c5a2a';
    for (var i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.ellipse(i * w * 0.16, w * 0.12 + Math.abs(i) * w * 0.05, w * 0.04, w * 0.09, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawBelt(s) {
    var w = s.size;
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.fillStyle = '#5a3a20';
    ctx.fillRect(-w * 0.55, -w * 0.07, w * 1.1, w * 0.14);
    for (var i = -3; i <= 3; i++) {
      if (Math.abs(i) < 1) continue;
      ctx.fillStyle = '#c1543f';
      ctx.strokeStyle = '#8f2f1f';
      ctx.lineWidth = Math.max(1, w * 0.01);
      ctx.beginPath();
      ctx.ellipse(i * w * 0.15, 0, w * 0.075, w * 0.055, i * 0.08, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
    }
    ctx.fillStyle = '#ffd700';
    ctx.fillRect(-w * 0.07, -w * 0.09, w * 0.14, w * 0.18);
    ctx.restore();
  }

  function drawSticker(s) {
    if (s.type === 'ears') drawEars(s);
    else if (s.type === 'glasses') drawGlasses(s);
    else if (s.type === 'beard') drawBeard(s);
    else if (s.type === 'belt') drawBelt(s);
  }

  function draw() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    if (img) {
      ctx.drawImage(img, 0, 0, cv.width, cv.height);
    } else {
      ctx.fillStyle = '#444';
      ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.fillStyle = '#fff';
      ctx.font = '22px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('Сначала загрузи фото ↑', cv.width / 2, cv.height / 2);
    }
    for (var i = 0; i < stickers.length; i++) drawSticker(stickers[i]);
  }

  document.getElementById('fileInput').addEventListener('change', function (e) {
    var f = e.target.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function (ev) {
      var image = new Image();
      image.onload = function () {
        img = image;
        var w = image.width, h = image.height;
        if (w > MAX || h > MAX) {
          if (w > h) { h = h * MAX / w; w = MAX; }
          else { w = w * MAX / h; h = MAX; }
        }
        cv.width = Math.round(w);
        cv.height = Math.round(h);
        stickers = [];
        draw();
      };
      image.src = ev.target.result;
    };
    reader.readAsDataURL(f);
  });

  var btns = document.querySelectorAll('.sticker-btn');
  for (var b = 0; b < btns.length; b++) {
    btns[b].addEventListener('click', function () {
      if (!img) { alert('Сначала загрузи фото!'); return; }
      stickers.push({
        type: this.dataset.type,
        size: Number(this.dataset.size),
        x: cv.width / 2,
        y: cv.height / 2
      });
      draw();
    });
  }

  function getPos(e) {
    var r = cv.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) * cv.width / r.width,
      y: (e.clientY - r.top) * cv.height / r.height
    };
  }

  cv.addEventListener('pointerdown', function (e) {
    if (!img) return;
    var p = getPos(e);
    for (var i = stickers.length - 1; i >= 0; i--) {
      var s = stickers[i];
      var rad = Math.max(s.size * 0.4, 40);
      if (Math.hypot(p.x - s.x, p.y - s.y) < rad) {
        drag = s;
        off.x = p.x - s.x;
        off.y = p.y - s.y;
        cv.setPointerCapture(e.pointerId);
        return;
      }
    }
  });

  cv.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var p = getPos(e);
    drag.x = p.x - off.x;
    drag.y = p.y - off.y;
    draw();
  });

  cv.addEventListener('pointerup', function () { drag = null; });
  cv.addEventListener('pointercancel', function () { drag = null; });

  document.getElementById('undo').addEventListener('click', function () {
    stickers.pop();
    draw();
  });

  document.getElementById('clear').addEventListener('click', function () {
    stickers = [];
    draw();
  });

  document.getElementById('download').addEventListener('click', function () {
    if (!img) { alert('Сначала загрузи фото!'); return; }
    draw();
    var a = document.createElement('a');
    a.download = 'my-sticker.png';
    a.href = cv.toDataURL('image/png');
    a.click();
  });

  draw();
</script>

</body>
</html>
